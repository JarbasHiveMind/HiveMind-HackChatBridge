name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # Network-free smoke tests only. The real e2e suite (tests/e2e/) boots a
      # hivemind-core hub and needs hivescope from an unreleased branch; it runs
      # in its own workflow (e2e_tests.yml).
      test_path: 'tests/test_smoke.py'
