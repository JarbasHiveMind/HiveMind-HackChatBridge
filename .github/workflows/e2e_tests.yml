name: E2E Tests

# Real end-to-end tests (tests/e2e/). These boot a REAL hivemind-core hub via
# hivescope's loopback topology and drive the bridge's production
# HiveMessageBusClient code path over an actual localhost WebSocket — no mocks
# on the HiveMind side. The live hack.chat test self-skips when wss://hack.chat
# egress is unavailable on the runner.
#
# hivescope is pulled from the fix/loopback-whitelist-only-connection branch via
# pre_install_pip: the published release still passes the removed
# msg_/skill_/intent_blacklist kwargs to HiveMindClientConnection (the
# whitelist-only model) and lacks get_client_by_id, so the loopback hub crashes
# mid-handshake without it.

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  e2e:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # Install the unreleased hivescope (loopback whitelist-only + get_client_by_id
      # fixes) before building/installing the bridge. --pre so its alpha deps resolve.
      pre_install_pip: >-
        --pre
        "hivescope @ git+https://github.com/JarbasHiveMind/hivescope.git@fix/loopback-whitelist-only-connection"
      install_extras: 'e2e'
      test_path: 'tests/e2e/'
      pr_comment: false
